{% extends "base.html" %}


{% block head_title %}
{{Judul}}

{% endblock head_title %}

{% block contents %}
<h1>{{Heading}}</h1>
{% include "messages.html" %}

<form method='post' enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
        {% for field in form %}
        <div class="mb-4">
 
            <label for="{{field.id_for_label}}">{{field.label}}</label>
            {{field}}
        </div>
        
        {% endfor %}
    </div>


    <button tpe='submit' class='btn btn-primary'>Kirim</button>
</form>
{% endblock contents %}
