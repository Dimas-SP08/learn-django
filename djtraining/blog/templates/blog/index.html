{% extends "base.html" %}


{% block head_title %}
{{judul}}
{% endblock head_title %}

{% block title %}
<h2>{{judul}}</h2>
{% endblock title %}

{% block content %}
<h2>{{heading}}</h2>

<div class="row">
    {% for post in Artikel %}
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <a href="/blog/detail/{{post.slug_art}}">
                <h2 class = "card-title">{{post.judul}}</h2></a>
                <span class="text-secodary">{{post.pubdate}}</span>
                <p class="text-dark fst-norma">{{post.isi}}</p>
            </div>
        </div>
        
    </div>
    {% endfor %}

</div>
{% endblock content %}
